services:
  postgres:
    image: postgres:16-alpine
    container_name: cabox_prd_db
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cabox_prd_pgdata:/var/lib/postgresql/data
    networks: [cabox-prd]
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout:  5s
      retries:  5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: cabox_prd_pgbouncer
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      SERVER_RESET_QUERY: DISCARD ALL
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cabox-prd]

  redis:
    image: redis:7-alpine
    container_name: cabox_prd_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - cabox_prd_redis:/data
    networks: [cabox-prd]
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  app:
    build:
      context: ./app
      dockerfile: ../Dockerfile.prd
    container_name: cabox_prd_app
    restart: always
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "6410:3000"    # Exposed to host nginx reverse proxy
    # Same rule as docker-compose.dev.yml: avoid KEY=${KEY} passthrough — empty host env
    # overrides env_file during `docker compose` interpolation.
    env_file:
      - ./.env.prd
    environment:
      NODE_ENV: production
    networks: [cabox-prd]

volumes:
  cabox_prd_pgdata:
  cabox_prd_redis:

networks:
  cabox-prd:
    driver: bridge
