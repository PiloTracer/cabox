services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    container_name: ${STORE_NAME:-cabox}_app
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./app/src:/app/src
      - ./app/prisma:/app/prisma
      - ./app/public:/app/public
      - ./app/tsconfig.json:/app/tsconfig.json
      - ./app/next.config.mjs:/app/next.config.mjs
      - ./app/postcss.config.mjs:/app/postcss.config.mjs
      - ./app/playwright.config.ts:/app/playwright.config.ts
      - ./app/e2e:/app/e2e
    # Do NOT mirror env vars here as KEY=${KEY}: when Compose runs without --env-file,
    # host interpolation is empty and overrides ./.env.dev (Prisma/NEXTAUTH break).
    env_file:
      - ./.env.dev

    depends_on:
      - pgbouncer
      - redis
    networks:
      - cabox_net
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ${STORE_NAME:-cabox}_nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - app
    networks:
      - cabox_net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: ${STORE_NAME:-cabox}_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cabox_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabox_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cabox_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cabox_pgdata:/var/lib/postgresql/data
    networks:
      - cabox_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cabox_user} -d ${POSTGRES_DB:-cabox_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ${STORE_NAME:-cabox}_pgbouncer
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cabox_user}:${POSTGRES_PASSWORD:-cabox_pass}@db:5432/${POSTGRES_DB:-cabox_dev}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      SERVER_RESET_QUERY: DISCARD ALL
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cabox_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${STORE_NAME:-cabox}_redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - cabox_redis:/data
    networks:
      - cabox_net
    restart: unless-stopped

# Static volume/network names — Compose v2 does not allow variable interpolation
# in top-level keys. For multi-store isolation use spawn_store.sh which generates
# a fully self-contained compose file per store with a unique COMPOSE_PROJECT_NAME.
volumes:
  cabox_pgdata:
  cabox_redis:

networks:
  cabox_net:
    driver: bridge
